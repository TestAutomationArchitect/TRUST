name: Publish

# Publishes to npm with provenance, so a partner org can verify the tarball was built
# from this repository by this workflow — not uploaded from someone's laptop.
#
# One-time setup:
#   1. Replace the placeholder scope in package.json (preflight blocks publish otherwise).
#   2. Create the npm org/scope and add an automation token as the NPM_TOKEN secret,
#      or configure a trusted publisher for this repo.
#   3. Protect the "npm" environment with required reviewers.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and verify without publishing
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: write # attach the tarball to the release
      id-token: write # OIDC — required for npm provenance
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      # No dependencies to install — that is the point. `npm ci` would fail without a
      # lockfile, so assert the invariant instead.
      - name: Assert dependency-free
        run: |
          node -e "
            const p = require('./package.json');
            for (const f of ['dependencies','peerDependencies','optionalDependencies']) {
              const d = Object.keys(p[f] ?? {});
              if (d.length) { console.error(f + ' must be empty: ' + d.join(', ')); process.exit(1); }
            }
            if (require('fs').existsSync('package-lock.json')) console.error('note: lockfile present but unused');
          "

      - name: Test
        run: npm test

      - name: Tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          PKG=$(node -p "require('./package.json').version")
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::tag v$TAG does not match package.json version $PKG"
            exit 1
          fi

      - name: Preflight
        run: node scripts/preflight.mjs

      - name: Pack
        run: |
          npm pack
          TARBALL=$(ls *.tgz)
          sha256sum "$TARBALL" | tee "$TARBALL.sha256"
          echo "TARBALL=$TARBALL" >> "$GITHUB_ENV"

      - name: Publish to npm with provenance
        if: startsWith(github.ref, 'refs/tags/v') && github.event.inputs.dry_run != 'true'
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Airgapped partners install the checksummed tarball instead of using a registry.
      - name: Attach tarball to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.TARBALL }}
            ${{ env.TARBALL }}.sha256
          body_path: CHANGELOG.md

      - name: Summary
        run: |
          {
            echo "### TRUST $(node -p "require('./package.json').version")"
            echo
            echo "- package: \`$(node -p "require('./package.json').name")\`"
            echo "- tarball: \`${TARBALL}\` (\`$(cut -d' ' -f1 < "${TARBALL}.sha256")\`)"
            echo "- provenance: attested via GitHub OIDC"
            echo
            echo "Partners install with \`npx $(node -p "require('./package.json').name") init --target https://dev.example.com\`"
          } >> "$GITHUB_STEP_SUMMARY"

name: Publish

# Publishes to npm using Trusted Publishing: npm exchanges this workflow's OIDC identity
# for a short-lived credential at publish time. No token is stored anywhere — nothing to
# leak, nothing to rotate, and no 2FA bypass to justify. Provenance is produced
# automatically, so a partner can verify the tarball was built by this workflow rather
# than uploaded from someone's laptop.
#
# One-time setup on npmjs.com → the package → Settings → Trusted Publisher:
#   Publisher:   GitHub Actions
#   Repository:  TestAutomationArchitect/TRUST
#   Workflow:    publish.yml
#   Environment: npm          (must match the environment: below)
#
# The package is unscoped, so no --access flag is needed.
#
# Note: npm's trusted-publisher settings live on the package, so a package that has never
# been published may need one manual release first (`npm publish --otp=<code>`) before the
# publisher can be configured. Every release after that needs no credential.
#
# Also protect the "npm" environment with required reviewers, so no release publishes
# without a human approving the deployment.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and verify without publishing
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: write # attach the tarball to the release
      id-token: write # OIDC — required for npm provenance
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      # Trusted publishing needs npm >= 11.5.1; Node 22 bundles npm 10.
      - name: Upgrade npm
        run: |
          npm install -g npm@latest
          npm --version

      # setup-node writes an .npmrc containing
      #   //registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}
      # and NODE_AUTH_TOKEN is unset here, because trusted publishing is the whole point.
      # npm then sees auth already configured for the registry, skips the OIDC exchange, and
      # PUTs with an empty credential — which the registry answers with a 404 that reads like
      # a missing package. Removing the line leaves the registry set and no credential, which
      # is the state that makes npm reach for OIDC.
      - name: Clear the empty token line so npm reaches for OIDC
        run: |
          for f in "$HOME/.npmrc" ".npmrc"; do
            [ -f "$f" ] && sed -i '/_authToken/d' "$f" && echo "cleaned $f"
          done
          npm config set registry https://registry.npmjs.org/
          echo "--- effective npmrc ---"
          npm config list

      # Which of the two possible causes is in play, stated before the publish rather than
      # inferred from its failure: no OIDC request URL means the job lacks id-token: write;
      # an OIDC URL plus a 404 means the publisher on npm does not match this workflow's claim.
      - name: OIDC availability
        run: |
          if [ -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            echo "OIDC token endpoint present — the job can request an identity."
          else
            echo "::error::No OIDC token endpoint. id-token: write is not in effect for this job."
            exit 1
          fi
          echo "repository: $GITHUB_REPOSITORY"
          echo "workflow:   $(basename "$GITHUB_WORKFLOW_REF" | cut -d@ -f1)"
          echo "environment must match the npm trusted-publisher config exactly: npm"

      # No dependencies to install — that is the point. `npm ci` would fail without a
      # lockfile, so assert the invariant instead.
      - name: Assert dependency-free
        run: |
          node -e "
            const p = require('./package.json');
            for (const f of ['dependencies','peerDependencies','optionalDependencies']) {
              const d = Object.keys(p[f] ?? {});
              if (d.length) { console.error(f + ' must be empty: ' + d.join(', ')); process.exit(1); }
            }
            if (require('fs').existsSync('package-lock.json')) console.error('note: lockfile present but unused');
          "

      - name: Test
        run: npm test

      - name: Tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          PKG=$(node -p "require('./package.json').version")
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::tag v$TAG does not match package.json version $PKG"
            exit 1
          fi

      - name: Preflight
        run: node scripts/preflight.mjs

      - name: Pack
        run: |
          npm pack
          TARBALL=$(ls *.tgz)
          sha256sum "$TARBALL" | tee "$TARBALL.sha256"
          echo "TARBALL=$TARBALL" >> "$GITHUB_ENV"

      # No NODE_AUTH_TOKEN: the OIDC exchange is the credential. id-token: write above is
      # what makes it possible, and provenance is generated as part of the exchange.
      - name: Publish to npm via trusted publishing
        if: startsWith(github.ref, 'refs/tags/v') && github.event.inputs.dry_run != 'true'
        run: npm publish --provenance

      # Airgapped partners install the checksummed tarball instead of using a registry.
      - name: Attach tarball to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.TARBALL }}
            ${{ env.TARBALL }}.sha256
          body_path: CHANGELOG.md

      - name: Summary
        run: |
          {
            echo "### TRUST $(node -p "require('./package.json').version")"
            echo
            echo "- package: \`$(node -p "require('./package.json').name")\`"
            echo "- tarball: \`${TARBALL}\` (\`$(cut -d' ' -f1 < "${TARBALL}.sha256")\`)"
            echo "- provenance: attested via GitHub OIDC (trusted publishing, no stored token)"
            echo
            echo "Partners install with \`npx $(node -p "require('./package.json').name") init --target https://dev.example.com\`"
          } >> "$GITHUB_STEP_SUMMARY"
